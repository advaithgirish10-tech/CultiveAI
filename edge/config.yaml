# Cultive AI edge config — one Raspberry Pi, one RS485 bus.
# Register maps are from vendor docs; anything marked VERIFY must be checked on site.

site:
  customer: cultive-internal
  site: kerala-test-01

serial:
  # "auto": every USB-RS485 adapter is checked at startup and each device is found on whichever
  # adapter it sits on, so any adapter can go in any USB socket. Missing devices are searched again
  # every 30 s (handles replugging). A fixed path (e.g. /dev/ttyUSB0) plus optional extra_ports still works.
  # Expo wiring: probe 4, lux 1, MD02 2, relay 10, each on its own adapter (lux and MD02 chatter ASCII).
  port: auto
  baudrate: 9600            # every device gets moved to 9600 8N1 during setup
  parity: N
  stopbits: 1
  timeout: 0.5

poll_interval_s: 2   # expo: 2 s so the TV feels live. Set back to 60 for the polyhouse.
offline_after_failures: 3   # consecutive failed reads before a device is marked offline
simulate: false             # true = fake sensors, no hardware needed
db_path: data/cultive.db

upload:
  url: ""                   # empty = keep everything local (SQLite) for now
  api_key: ""              # leave empty here; put the real key in .env as CULTIVE_API_KEY (never commit it)
  batch_size: 200

devices:
  # ---- Air temperature / humidity: MD02 (SHT20) ----
  - id: air-1
    model: md02
    address: 2
    zone: test-tray-1
    registers:
      - {param: air_temp, reg: 0x0001, fc: 4, type: s16, scale: 0.1, unit: C}
      - {param: air_humidity, reg: 0x0002, fc: 4, type: u16, scale: 0.1, unit: "%RH"}

  # ---- Light: Wittelb WIN-SN-LUX-M (address set by jumpers on the board, not software) ----
  # Found at factory address 1 @ 9600 on 10 Oct; kept at 1 (no other device uses 1 after addressing).
  - id: light-1
    model: wittelb_lux
    address: 1
    zone: test-tray-1
    registers:
      # Verified 10 Oct with a torch: reg 0 is plain lux (62 -> 19913), reg 2 = 65000 (range max).
      - {param: light_lux, reg: 0x0000, fc: 3, type: u16, scale: 1, unit: lux}

  # ---- Pot substrate: Renke RS-ECTHPH-N01-TR-1 (4-in-1), probe inside ONE representative pot ----
  # In potting mix (cocopeat etc.) absolute values are off; use it as a trend + proof a flood cycle ran.
  - id: pot-1
    model: renke
    address: 4
    zone: test-tray-1
    registers:
      - {param: soil_moisture, reg: 0x0000, fc: 3, type: u16, scale: 0.1, unit: "%VWC"}
      - {param: soil_temp, reg: 0x0001, fc: 3, type: s16, scale: 0.1, unit: C}
      - {param: soil_ec, reg: 0x0002, fc: 3, type: u16, scale: 1, unit: "uS/cm"}
      - {param: soil_ph, reg: 0x0003, fc: 3, type: u16, scale: 0.1, unit: pH}

  # ---- Water tank level: DFRobot URM15 ultrasonic ----
  - id: tank-1
    enabled: false            # expo: off (optional sensor). Set true once it's addressed to 5
    model: urm15
    address: 5
    zone: reservoir
    tank_height_cm: 100       # SET ON SITE: sensor face to tank bottom, in cm
    registers:
      - {param: tank_distance_cm, reg: 0x0005, fc: 3, type: u16, scale: 0.1, unit: cm, invalid: 0xFFFF}

  # ---- Nutrient reservoir pH: Renke RS-PH-N01 (probe sits in the fertigation tank) ----
  # VERIFY on site: compare against a pH pen / pH 7 buffer. If it reads ~10x off, change scale to 0.1.
  - id: res-ph-1
    enabled: false            # expo: stays home. Set true at the polyhouse
    model: renke
    address: 6
    zone: reservoir
    registers:
      - {param: reservoir_ph, reg: 0x0000, fc: 3, type: u16, scale: 0.01, unit: pH}
      - {param: reservoir_temp, reg: 0x0001, fc: 3, type: s16, scale: 0.1, unit: C}

relays:
  # Cultive owns WATER. Agrowtrack owns AIR (misting, top vent fan, 1 other fan, lights) — never wire those here.
  # Panel functions go through the contractor's electrician via the AUTO terminals; selector on MANUAL/OFF = override.
  id: relay-1
  model: waveshare_relay8
  address: 10
  channels:
    # Expo wiring: CH1 on the board = channel 0 = mini pump, CH2 = channel 1 = mini fan.
    0: {name: demo-pump, max_on_s: 60}                   # no tank sensor at the expo: keep the bucket full
    1: {name: demo-fan, max_on_s: 120}
    # CH3 = channel 2 = LED strip, wired to NC (COM -> 12V+, NC -> strip +). Relay ON = strip OFF.
    2: {name: demo-led-cut, max_on_s: 30}
    # Polyhouse later: test-tray valve, drip, submersible pump (with interlock), Bays 1-5.
    # 2: {name: submersible-pump, max_on_s: 1800, interlock: {param: tank_level_pct, min: 15}}

# ---- Expo demo (used by expo/app.py) ----
# Run the edge service with --interval 2 at the expo so readings feel live.
expo:
  zone_name: Anthurium demo tray
  valve_channel: 0      # relay channel the water device is wired to (the mini pump)
  water_s: 10           # how long one approved watering runs (tune after the flow test)
  dry_below: 25         # pot moisture % that triggers a WhatsApp ask
  cooldown_s: 120       # minimum gap between automatic asks
  ask_expire_s: 300     # unanswered asks expire after this
  settle_s: 30          # wait after watering before measuring the result
  fan_channel: 1        # relay channel the mini fan is wired to
  fan_s: 20             # how long the fan runs per trigger
  fan_rise: 8           # humidity points above its recent normal that trigger the fan
  fan_cooldown_s: 40    # gap after the fan stops before it can trigger again
  light_channel: 2      # relay channel the LED strip is wired to (NC contact: strip is ON unless the relay is ON)
  light_off_s: 10       # strip goes off this long when a torch hits the lux sensor (stays off while it stays bright)
  light_bright_lux: 1500  # lux that counts as "torch". Room is ~200-500. Check the TV with the strip on and set well above
